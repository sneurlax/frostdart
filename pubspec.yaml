name: frostdart
description: Dart FFI bindings for Serai FROST threshold-signed Bitcoin wallets, built with native assets.
version: 0.3.0
homepage: https://github.com/cypherstack/frostdart

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.0.1
  native_prebuilt_hook:
    path: ../native-build-kit/dart/native_prebuilt_hook

dev_dependencies:
  test: ^1.26.3
  ffigen: ^21.0.0
  flutter_lints: ^2.0.0
