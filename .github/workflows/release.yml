name: Test native assets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0'
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: dart pub get --no-example
      - run: dart analyze lib test hook
      - run: dart test
      - name: Rust tests
        if: matrix.os == 'ubuntu-24.04'
        working-directory: src/serai/hrf
        run: cargo test --locked --workspace --exclude bitcoin-serai

  flutter-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arguments: linux --release
          - os: windows-latest
            target: windows
            arguments: windows --release
          - os: macos-latest
            target: macos
            arguments: macos --release
          - os: macos-latest
            target: ios-simulator
            arguments: ios --simulator --debug
          - os: ubuntu-24.04
            target: android-arm64
            arguments: apk --debug --target-platform android-arm64
    name: Flutter build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
        working-directory: example
      - run: flutter build ${{ matrix.arguments }}
        working-directory: example
